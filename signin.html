<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - بن دول باي</title>
    <link rel="icon" href="assets/img/icone.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary: #364abf;
            --primary-dark: #2b3b99;
            --secondary: #f92238;
            --bg: #e8ecf5;
            --card: #ffffff;
            --ink: #1a1d2e;
            --ink-soft: #6b7280;
            --line: #e6e8ed;
            --selected-bg: rgba(54,74,191,0.1);
            --selected-border: rgba(54,74,191,0.25);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            overflow-y: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }
        .topbar .logo-sm img { height: 28px; }
        .topbar .lang {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
        }

        .page-content {
            padding: 0 24px 32px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 16px;
        }
        .logo-area img {
            height: 72px;
        }
        .welcome-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .welcome-sub {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 24px;
        }

        /* Role tabs */
        .role-tabs {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
        }
        .role-tab {
            width: 110px;
            padding: 18px 10px 14px;
            border-radius: 16px;
            background: var(--card);
            border: 2px solid transparent;
            cursor: pointer;
            text-align: center;
            transition: all .2s;
            box-shadow: 0 2px 8px rgba(0,0,0,.03);
        }
        .role-tab .tab-icon {
            font-size: 28px;
            color: var(--ink-soft);
            margin-bottom: 8px;
            display: block;
        }
        .role-tab .tab-label {
            font-size: 15px;
            font-weight: 800;
            color: var(--ink);
        }
        .role-tab.active {
            background: var(--selected-bg);
            border-color: var(--selected-border);
        }
        .role-tab.active .tab-icon {
            color: var(--primary);
        }

        /* Form */
        .form-area {
            text-align: right;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .input-wrap {
            flex: 1;
            position: relative;
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.03);
        }
        .input-wrap .icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 20px;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            height: 54px;
            border: none;
            padding: 0 50px 0 16px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
            outline: none;
            background: transparent;
        }
        .input-wrap input::placeholder {
            color: #b0b5c0;
            font-weight: 500;
        }
        .cashier-btn {
            height: 54px;
            padding: 0 18px;
            border: none;
            border-radius: 14px;
            background: var(--card);
            color: var(--ink);
            font-family: inherit;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,.03);
            white-space: nowrap;
            display: none;
        }
        .cashier-btn.show { display: block; }

        .forgot-link {
            text-align: center;
            margin: 20px 0;
        }
        .forgot-link a {
            color: var(--ink);
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 14px;
            background: var(--primary);
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            transition: background .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-btn:hover { background: var(--primary-dark); }
        .login-btn:disabled { background: #aab; cursor: not-allowed; }

        .err-msg {
            color: var(--secondary);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            min-height: 18px;
            margin-top: 10px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
            color: var(--ink-soft);
        }
        .register-link a {
            color: var(--primary);
            font-weight: 800;
            text-decoration: none;
        }

        .fingerprint {
            text-align: center;
            margin-top: 24px;
        }
        .fingerprint i {
            font-size: 48px;
            color: var(--primary);
            opacity: .5;
        }

        /* Bottom contact */
        .bottom {
            padding: 28px 24px 20px;
            text-align: center;
        }
        .contact-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
            direction: ltr;
        }
        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .contact-item .icon-box {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
        }
        .contact-item .icon-box.red { color: var(--secondary); }
        .contact-item .icon-box.blue { color: var(--primary); }
        .contact-item span {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-soft);
        }
        .version {
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
        }

        .spinner {
            display: none;
            width: 22px; height: 22px;
            border: 3px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Top bar -->
    <div class="topbar">
        <a href="login.html" class="logo-sm">
            <img src="assets/img/logo2.png" alt="بن دول باي">
        </a>
        <span class="lang">العربية</span>
    </div>

    <!-- Page content -->
    <div class="page-content">
        <div class="logo-area">
            <img src="assets/img/app-icon.png" alt="بن دول باي">
        </div>
        <h1 class="welcome-title">مرحباً بك</h1>
        <p class="welcome-sub">تسجيل الدخول</p>

        <!-- Role tabs -->
        <div class="role-tabs">
            <div class="role-tab" data-role="agent" onclick="selectRole(this)">
                <i class="fa-solid fa-people-group tab-icon"></i>
                <span class="tab-label">وكيل</span>
            </div>
            <div class="role-tab" data-role="merchant" onclick="selectRole(this)">
                <i class="fa-solid fa-store tab-icon"></i>
                <span class="tab-label">تاجر</span>
            </div>
            <div class="role-tab active" data-role="customer" onclick="selectRole(this)">
                <i class="fa-solid fa-user tab-icon"></i>
                <span class="tab-label">عميل</span>
            </div>
        </div>

        <!-- Form -->
        <form id="loginForm" class="form-area" onsubmit="return false;">
            <div class="input-row">
                <button type="button" class="cashier-btn" id="cashierBtn">الكاشير</button>
                <div class="input-wrap">
                    <i class="fa-solid fa-mobile-screen-button icon"></i>
                    <input type="tel" id="phone" placeholder="رقم الجوال" autocomplete="tel" required>
                </div>
            </div>

            <div class="input-row">
                <div class="input-wrap">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" required>
                </div>
            </div>

            <div class="forgot-link">
                <a href="#">هل نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn" onclick="handleLogin()">
                <span id="btnText">تسجيل الدخول</span>
                <div class="spinner" id="spinner"></div>
            </button>

            <p class="err-msg" id="errMsg"></p>
        </form>

        <p class="register-link">ليس لديك حساب؟ <a href="#">إنشاء حساب.</a></p>

        <div class="fingerprint">
            <i class="fa-solid fa-fingerprint"></i>
        </div>
    </div>

    <!-- Bottom contacts -->
    <div class="bottom">
        <div class="contact-icons">
            <a href="#" class="contact-item">
                <div class="icon-box red"><i class="fa-solid fa-location-dot"></i></div>
                <span>نقاط الخدمة</span>
            </a>
            <a href="#" class="contact-item">
                <div class="icon-box blue"><i class="fa-solid fa-envelope"></i></div>
                <span>البريد الإلكتروني</span>
            </a>
            <a href="#" class="contact-item">
                <div class="icon-box blue"><i class="fa-solid fa-phone-flip"></i></div>
                <span>الرقم المجاني</span>
            </a>
            <a href="#" class="contact-item">
                <div class="icon-box red"><i class="fa-solid fa-headset"></i></div>
                <span>خدمة العملاء</span>
            </a>
        </div>
        <p class="version">الإصدار : 128</p>
    </div>

<script>
function selectRole(el) {
    document.querySelectorAll('.role-tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
    var role = el.getAttribute('data-role');
    var cb = document.getElementById('cashierBtn');
    if (role === 'merchant') { cb.classList.add('show'); }
    else { cb.classList.remove('show'); }
}

function handleLogin() {
    var phone = document.getElementById('phone').value.trim();
    var pass = document.getElementById('password').value.trim();
    var err = document.getElementById('errMsg');
    var btn = document.getElementById('loginBtn');
    var txt = document.getElementById('btnText');
    var sp = document.getElementById('spinner');
    if (!phone || !pass) { err.textContent = 'يرجى إدخال جميع البيانات'; return; }
    err.textContent = '';
    btn.disabled = true; txt.style.display = 'none'; sp.style.display = 'block';
    setTimeout(function() {
        btn.disabled = false; txt.style.display = ''; sp.style.display = 'none';
        err.textContent = 'رقم الجوال أو كلمة المرور غير صحيحة';
    }, 2000);
}
</script>
</body>
</html>
