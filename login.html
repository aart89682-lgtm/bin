<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل دخول - بن دول باي</title>
    <link rel="icon" href="assets/img/icone.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary: #364abf;
            --primary-dark: #2b3b99;
            --secondary: #f92238;
            --bg: #e8ecf5;
            --ink: #1a1d2e;
            --ink-soft: #6b7280;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }
        .topbar .lang {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
        }
        .topbar .logo-sm img {
            height: 28px;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 32px;
            text-align: center;
        }
        .app-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 32px;
        }
        .welcome-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--ink);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .welcome-sub {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 48px;
        }

        /* Buttons */
        .btn-group {
            width: 100%;
            max-width: 400px;
        }
        .btn-create {
            display: block;
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 14px;
            background: var(--primary);
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 16px;
            text-decoration: none;
            line-height: 56px;
            text-align: center;
            transition: background .2s;
        }
        .btn-create:hover {
            background: var(--primary-dark);
        }
        .btn-login {
            display: block;
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 14px;
            background: rgba(54, 74, 191, 0.12);
            color: var(--primary);
            font-family: inherit;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            line-height: 56px;
            text-align: center;
            transition: background .2s;
        }
        .btn-login:hover {
            background: rgba(54, 74, 191, 0.2);
        }

        /* Bottom section */
        .bottom {
            padding: 32px 24px 24px;
            text-align: center;
        }
        .contact-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            direction: ltr;
        }
        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .contact-item .icon-box {
            width: 52px;
            height: 52px;
            background: #fff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
        }
        .contact-item .icon-box.red { color: var(--secondary); }
        .contact-item .icon-box.blue { color: var(--primary); }
        .contact-item span {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-soft);
        }
        .version {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .privacy {
            font-size: 13px;
            color: #aaa;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Top bar -->
    <div class="topbar">
        <a href="index.html" class="logo-sm">
            <img src="assets/img/logo2.png" alt="بن دول باي">
        </a>
        <span class="lang">العربية</span>
    </div>

    <!-- Main -->
    <div class="main">
        <img src="assets/img/app-icon.png" alt="بن دول باي" class="app-logo">
        <h1 class="welcome-title">مرحباً بك حيثما تكون</h1>
        <p class="welcome-sub">تجربة مالية أسهل تبدأ من هنا</p>

        <div class="btn-group">
            <a href="#" class="btn-create">إنشاء حساب</a>
            <a href="#" class="btn-login">تسجيل الدخول</a>
        </div>
    </div>

    <!-- Bottom -->
    <div class="bottom">
        <div class="contact-icons">
            <a href="#" class="contact-item">
                <div class="icon-box red"><i class="fa-solid fa-location-dot"></i></div>
                <span>نقاط الخدمة</span>
            </a>
            <a href="#" class="contact-item">
                <div class="icon-box blue"><i class="fa-solid fa-envelope"></i></div>
                <span>البريد الإلكتروني</span>
            </a>
            <a href="#" class="contact-item">
                <div class="icon-box blue"><i class="fa-solid fa-phone-flip"></i></div>
                <span>الرقم المجاني</span>
            </a>
            <a href="#" class="contact-item">
                <div class="icon-box red"><i class="fa-solid fa-headset"></i></div>
                <span>خدمة العملاء</span>
            </a>
        </div>
        <p class="version">الإصدار : 128</p>
        <a href="#" class="privacy">سياسة الخصوصية</a>
    </div>

</body>
</html>
